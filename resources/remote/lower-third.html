<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>OpenPresenter Lower Third</title>
<!-- OBS Browser Source: 1920×1080, transparent background. Optional ?size=48 to change font size. -->
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #box { position:absolute; left:5%; right:5%; bottom:6%; text-align:center; color:#fff; font-weight:700;
         text-shadow: 0 0 6px #000, 0 2px 4px #000, 0 0 2px #000; white-space:pre-wrap; line-height:1.3;
         transition: opacity .25s ease; opacity:0; }
  #box.on { opacity:1; }
  #tr { display:block; font-weight:400; font-style:italic; font-size:.72em; color:#fde68a; margin-top:.2em; }
  @media (prefers-reduced-motion: reduce) { #box { transition:none; } }
</style>
</head>
<body>
<div id="box"><span id="text"></span><span id="tr"></span></div>
<script>
  const size = new URLSearchParams(location.search).get('size') || '52'
  const box = document.getElementById('box')
  box.style.fontSize = size + 'px'
  const es = new EventSource('/events/public')
  es.onmessage = (e) => {
    const { live } = JSON.parse(e.data)
    if (!live) return box.classList.remove('on')
    // Bible slides keep their "(Giăng 3:16)" line — viewers want the reference.
    document.getElementById('text').textContent = live.text
    document.getElementById('tr').textContent = live.translation || ''
    box.classList.add('on')
  }
</script>
</body>
</html>
